name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest numpy
      - run: pytest tests/test_unit.py -q
  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
      REDIS_URL: redis://localhost:6379/0
      EMBEDDING_BACKEND: hash
      RERANK_BACKEND: none
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install fastapi "uvicorn[standard]" python-multipart "psycopg[binary]" psycopg_pool pgvector redis rq pyjwt bcrypt pypdf python-docx numpy anthropic pytest httpx
      - run: pytest -q
