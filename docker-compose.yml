services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: rag, POSTGRES_PASSWORD: rag, POSTGRES_DB: rag }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    volumes: [uploads:/data/uploads]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
volumes:
  pgdata:
  uploads:
